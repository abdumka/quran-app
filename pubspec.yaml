name: islamic_dawah_mushaf
description: "المصحف الجامع - Al-Mushaf Al-Jame."
publish_to: 'none'

# ONE build number serves both stores, and it must only ever go UP.
#
# App Store Connect holds 1.4.0 (25, 26, 27, 100) and 1.4.1 (101). It rejects a
# number it has already seen in the same version train ("bundle version must be
# higher than the previously uploaded version: 100"), which is what stranded an
# earlier 1.4.0+27 upload. A new marketing version may in principle restart the
# count, but staying above the highest number ever uploaded removes the question.
#
# Play is the stricter one, because `--split-per-abi` does NOT ship this number
# as-is: it multiplies by the ABI, so +102 became 1102 (armeabi-v7a), 2102
# (arm64-v8a) and 4102 (x86_64). Play refuses any versionCode it has seen before
# on any track, so a LOWER build number here silently becomes an unuploadable
# APK — e.g. +30 would produce 1030/2030/4030, beneath the 4102 already built.
version: 1.5.0+103

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  screen_brightness: ^2.1.9
  wakelock_plus: ^1.5.1
  share_plus: ^13.1.0
  url_launcher: ^6.3.1
  http: ^1.4.0
  path_provider: ^2.1.5
  archive: ^4.0.9
  crypto: ^3.0.6
  path: ^1.9.1
  in_app_review: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.3
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^10.1.0
  file_selector: ^1.1.0
  file_saver: ^0.4.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Memorization-test mode: on-device recitation recognition.
  record: ^6.1.2
  permission_handler: ^12.0.1
  sherpa_onnx: ^1.13.6
  vibration: ^3.2.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1    

flutter_launcher_icons:
  ios: false
  android: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_android: "store_assets/1024x1024android.png"
  adaptive_icon_background: "#a86b0c"
  adaptive_icon_foreground: "store_assets/1024x1024android.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/output.json
    - assets/data/ar.saddi.json
    - assets/data/ar.muyassar.json
    - assets/data/ar.jalalayn.json
    - assets/data/narration_map.json
    - assets/data/ayah_positions.json
    - assets/data/ayah_regions.json
    - assets/data/word_masks.json
    - assets/data/page_phonemes.json
    - assets/data/phoneme_lexicon.json
    - assets/audio/tasmee_alert.wav
    - assets/audio/tasmee_ok.wav
    - assets/data/audio_ayah_map.json
    - assets/data/qaniwah_continuations.json
  
